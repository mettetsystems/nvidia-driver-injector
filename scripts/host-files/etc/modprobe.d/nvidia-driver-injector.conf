# /etc/modprobe.d/nvidia-driver-injector.conf
#
# Dual-GPU-safe production posture for the patched NVIDIA driver.
# One nvidia.ko binds every NVIDIA GPU, so this file must not disable
# autoload, nvidia_drm KMS, or graphics ICDs.
#
# eGPU-only (no internal NVIDIA display GPU) hosts also install
# nvidia-driver-injector-compute-only.conf.
#
# The injector entrypoint loads with `modprobe --ignore-install` when
# a compute-only overlay is present; on dual-GPU hosts ordinary
# autoload is allowed so the RTX 2070 graphics path keeps working.
#
# Device-file permissions: nvidia-modprobe uses these defaults.
# GID for the 'gpu' group; apply.sh rewrites NVreg_DeviceFileGID if
# the host gid differs. Display sessions must be in 'gpu' to open
# /dev/nvidia*.

options nvidia NVreg_DeviceFileMode=0660 NVreg_DeviceFileUID=0 NVreg_DeviceFileGID=968

# Disable driver-level runtime PM. Global (one module, all GPUs).
# Kept so the eGPU Q-watchdog can MMIO BAR0 without RTD3 races.
# Side effect: the internal GPU also will not use driver RTD3.
options nvidia NVreg_DynamicPowerManagement=0x00

# nvprof / nsys / cupti require root. Does not affect display.
options nvidia NVreg_RestrictProfilingToAdminUsers=1

# Master enable for in-driver TB eGPU recovery (addon A3). Init and
# AER recovery are additionally scoped to PCI 10de:2b85 in the module.
options nvidia NVreg_TbEgpuRecoverEnable=1
